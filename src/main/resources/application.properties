spring.application.name=BacNaoDay

spring.datasource.url=jdbc:postgresql://localhost:5432/bacnaoday
spring.datasource.username=${DATABASE_USERNAME:bacnaoday}
spring.datasource.password=${DATABASE_PASSWORD:bacnaoday}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Initial user when registration is out of scope (set APP_SEED_PASSWORD in dev/prod)
app.user.seed.enabled=true
app.user.seed.username=${APP_SEED_USERNAME:demo}
app.user.seed.password=${APP_SEED_PASSWORD:demo}

# JWT (set APP_JWT_SECRET in production; must be >= 32 UTF-8 bytes)
app.jwt.secret=${APP_JWT_SECRET:change-me-use-long-secret-at-least-32b!}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:86400}
